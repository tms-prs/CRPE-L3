        solution: "AC = 20 × tan 35° ≈ 14,0 m." },

      { type: "num", q: "Une échelle de 6 m est appuyée contre un mur et fait un angle de 70° avec le sol. À quelle hauteur touche-t-elle le mur ? Arrondir au centième (en m).", answer: "5.64", tol: 0.005,

    { title: "B. Calculer un angle", items: [
      { type: "num", q: "ABC est rectangle en A, AB = 4 cm et BC = 5 cm. Calculer B̂, arrondi au degré (en °).", answer: "37", tol: 0.5,
        hint: "cos B̂ = 4/5.",
        solution: "B̂ = cos⁻¹(0,8) ≈ 36,9°, soit 37°." },
      { type: "num", q: "ABC est rectangle en A, AC = 3 cm et AB = 4 cm. Calculer B̂, arrondi au degré (en °).", answer: "37", tol: 0.5,

      { type: "num", q: "Un triangle rectangle a un angle aigu de 40°. Combien mesure l'autre angle aigu (en °) ?", answer: "50",

      { type: "num", q: "Dans un triangle rectangle, les deux côtés de l'angle droit sont égaux. Quelle est la mesure de chaque angle aigu (en °) ?", answer: "45",

      { type: "num", q: "On se place à 50 m du pied d'une tour et on voit son sommet sous un angle de 40°. Quelle est la hauteur de la tour, arrondie au mètre (en m) ?", answer: "42", tol: 0.5,

    ]},
    { title: "Problème 2 · Le cerf-volant", statement: "Un cerf-volant est retenu par un fil tendu de 60 m, qui fait un angle de 40° avec le sol horizontal. On suppose que la main est au niveau du sol.", items: [

        solution: "sin α = 38,6 ÷ 45 ≈ 0,858, donc α = sin⁻¹(0,858) ≈ 59°." }
    ]}
  ]
