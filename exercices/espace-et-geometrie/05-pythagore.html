      { type: "num", q: "Un rectangle mesure 40 m sur 30 m. Quelle est la longueur de sa diagonale (en m) ?", answer: "50",

      { type: "num", q: "Un carré a pour côté 4 cm. Calculer sa diagonale, arrondie au dixième (en cm).", answer: "5.7", tol: 0.05,

    ]},
    { title: "B. Calculer un côté de l'angle droit", items: [
      { type: "num", q: "ABC est rectangle en A, BC = 13 cm et AB = 5 cm. Calculer AC (en cm).", answer: "12",

      { type: "num", q: "Un triangle isocèle de base 10 cm a deux côtés égaux de 13 cm. Quelle est sa hauteur (en cm) ?", answer: "12",

      { type: "num", q: "Un écran a pour largeur 16 cm et pour diagonale 20 cm. Quelle est sa hauteur (en cm) ?", answer: "12",
        solution: "h² = 400 − 256 = 144, h = 12 cm." }
    ]},
    { title: "C. Réciproque et contraposée", items: [
      { type: "qcm", q: "AB = 9, AC = 12, BC = 15. Le triangle ABC est-il rectangle ?",
        options: ["Oui, en A", "Non", "Oui, en B"], answer: 0,

      { type: "qcm", q: "AB = 5, AC = 12, BC = 14. Le triangle ABC est-il rectangle ?",

      { type: "qcm", q: "Quelle égalité faut-il vérifier pour prouver qu'un triangle de côtés 8, 15 et 17 est rectangle ?",

    { title: "Problème 1 · L'échelle du peintre", statement: "Un peintre pose une échelle de 4 m contre un mur vertical. Le sol est horizontal. Le pied de l'échelle est à 1,5 m du mur.", items: [

        solution: "Le mur et le sol sont perpendiculaires : le triangle formé est rectangle, l'échelle en est l'hypoténuse. h² = 4² − 1,5² = 16 − 2,25 = 13,75 (Pythagore), h ≈ 3,71 m." },

        solution: "On trace la perpendiculaire à (AB) issue de C, qui coupe [AB] en H : AH = DC = 8, donc HB = 14 − 8 = 6 ; CH = AD = 8. Dans le triangle CHB rectangle en H : BC² = 6² + 8² = 100 (Pythagore), BC = 10 m." },

        solution: "14 + 10 + 8 + 8 = 40 m." },
      { type: "num", label: "c)", q: "Quelle est l'aire du terrain (en m²) ?", answer: "88",
        solution: "Aire du trapèze = (grande base + petite base) × hauteur ÷ 2 = (14 + 8) × 8 ÷ 2 = 88 m²." }
    ]}
  ]
