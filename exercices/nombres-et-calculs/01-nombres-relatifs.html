<script>
window.PAGE = {
  id: "exo-01-nombres-relatifs",
  title: "Exercices 01 — Nombres relatifs",
  subtitle: "Tape ta réponse (−3, -3, 1/2 ou 0,5 acceptés), puis Vérifier. Indice et correction disponibles. Leçon : lecons/nombres-et-calculs/01-nombres-relatifs.md",
  sections: [
    { title: "A. Opposé, valeur absolue, distance", items: [
      { type: "num", q: "Donner l'opposé de −12,5.", answer: "12.5",
        hint: "L'opposé de a est −a : le nombre qui, ajouté à a, donne 0.",
        solution: "−12,5 + 12,5 = 0, donc l'opposé est 12,5." },
      { type: "num", q: "Donner la valeur absolue de −9,4.", answer: "9.4",
        hint: "C'est la distance entre le point et 0.",
        solution: "|−9,4| = 9,4." },
      { type: "num", q: "Quelle est la distance entre les points d'abscisses −3 et 5 ?", answer: "8",
        hint: "Distance = |a − b|.",
        solution: "|5 − (−3)| = |5 + 3| = 8." },
      { type: "num", q: "Combien y a-t-il d'entiers relatifs strictement compris entre −4,5 et 3,2 ?", answer: "8",
        hint: "Liste-les un par un, sans oublier 0.",
        solution: "−4 ; −3 ; −2 ; −1 ; 0 ; 1 ; 2 ; 3, soit 8 entiers." }
    ]},
    { title: "B. Additions et soustractions", items: [
      { type: "num", q: "Calculer (−7) + (−5).", answer: "-12",
        hint: "Même signe : on additionne les valeurs absolues.",
        solution: "(−7) + (−5) = −(7 + 5) = −12." },
      { type: "num", q: "Calculer (−9) + 14.", answer: "5",
        hint: "Signes différents : 14 − 9, signe du plus grand en valeur absolue.",
        solution: "14 − 9 = 5, et 14 > 9 donc le résultat est positif : 5." },
      { type: "num", q: "Calculer 6 − 11.", answer: "-5",
        hint: "6 − 11 = 6 + (−11).",
        solution: "6 + (−11) = −5." },
      { type: "num", q: "Calculer (−4) − (−10).", answer: "6",
        hint: "Soustraire, c'est ajouter l'opposé.",
        solution: "(−4) − (−10) = (−4) + 10 = 6." },
      { type: "num", q: "Calculer (−3) + 8 + (−5) + 2.", answer: "2",
        hint: "Regroupe les positifs d'un côté, les négatifs de l'autre.",
        solution: "(8 + 2) + (−3 − 5) = 10 − 8 = 2." },
      { type: "num", q: "Calculer −2,5 + 4,8 − 1,3.", answer: "1",
        hint: "Pas de piège : va de gauche à droite.",
        solution: "−2,5 + 4,8 = 2,3 ; puis 2,3 − 1,3 = 1." }
    ]},
    { title: "C. Multiplications et divisions", items: [
      { type: "num", q: "Calculer (−6) × 7.", answer: "-42",
        hint: "Signes contraires : produit négatif.",
        solution: "6 × 7 = 42, produit négatif : −42." },
      { type: "num", q: "Calculer (−8) × (−5).", answer: "40",
        hint: "Même signe : produit positif.",
        solution: "8 × 5 = 40, positif : 40." },
      { type: "num", q: "Calculer (−48) ÷ (−6).", answer: "8",
        solution: "48 ÷ 6 = 8, même signe donc positif : 8." },
      { type: "num", q: "Calculer 36 ÷ (−9).", answer: "-4",
        solution: "36 ÷ 9 = 4, signes contraires donc négatif : −4." },
      { type: "num", q: "Calculer (−2) × (−3) × (−5) × (−1).", answer: "30",
        hint: "Compte le nombre de facteurs négatifs : pair ou impair ?",
        solution: "Quatre facteurs négatifs (nombre pair) : produit positif. 2 × 3 × 5 × 1 = 30." },
      { type: "num", q: "Calculer (−1,5) × 4.", answer: "-6",
        solution: "1,5 × 4 = 6, signes contraires : −6." },
      { type: "text", q: "Que vaut 7 ÷ 0 ? (écris « impossible » ou « n'existe pas »)", accept: ["impossible", "existepas", "pasdéfini", "pasdefini", "indéfini", "indefini"],
        shown: "impossible",
        hint: "Existe-t-il un nombre x tel que 0 × x = 7 ?",
        solution: "Aucun nombre multiplié par 0 ne donne 7 : la division par 0 est impossible." }
    ]},
    { title: "D. Enchaînements d'opérations", items: [
      { type: "num", q: "Calculer 2 − 3 × (−4) + (−6) ÷ 2.", answer: "11",
        hint: "Multiplications et divisions d'abord.",
        solution: "2 − (−12) + (−3) = 2 + 12 − 3 = 11." },
      { type: "num", q: "Calculer (−5 + 2) × (3 − 7).", answer: "12",
        hint: "Calcule d'abord chaque parenthèse.",
        solution: "(−3) × (−4) = 12." },
      { type: "num", q: "Calculer −2² + (−3)².", answer: "5",
        hint: "−2² = −(2²), alors que (−3)² = (−3) × (−3).",
        solution: "−2² = −4 ; (−3)² = 9 ; −4 + 9 = 5." },
      { type: "num", q: "Calculer 10 − 2 × (5 − 8).", answer: "16",
        solution: "5 − 8 = −3 ; 2 × (−3) = −6 ; 10 − (−6) = 16." },
      { type: "num", q: "Calculer [(−2) × (−6) − 20] ÷ (−4).", answer: "2",
        solution: "(−2) × (−6) = 12 ; 12 − 20 = −8 ; (−8) ÷ (−4) = 2." }
    ]},
    { title: "E. Problèmes", items: [
      { type: "num", q: "Un ascenseur part de l'étage −2 (sous-sol), monte de 5 étages, descend de 9 étages, puis monte de 3 étages. À quel étage arrive-t-il ?", answer: "-3",
        hint: "Traduis chaque déplacement par un relatif : +5, −9, +3.",
        solution: "−2 + 5 − 9 + 3 = −3 : sous-sol −3." },
      { type: "num", q: "Un compte affiche −45 €. On crédite 120 €, puis on débite trois fois 30 €. Quel est le solde final (en €) ?", answer: "-15",
        hint: "Trois débits de 30 € = 3 × (−30).",
        solution: "−45 + 120 + 3 × (−30) = 75 − 90 = −15 €." },
      { type: "num", q: "La température est de −3 °C la nuit et de 12 °C l'après-midi. Quel est l'écart de température ?", answer: "15",
        hint: "Écart = plus grande valeur − plus petite valeur.",
        solution: "12 − (−3) = 12 + 3 = 15 °C." },
      { type: "num", q: "À 3 °C, la température baisse de 2 °C chaque heure pendant 5 heures. Quelle température finale (en °C) ?", answer: "-7",
        hint: "Écris 3 + 5 × (−2).",
        solution: "3 + 5 × (−2) = 3 − 10 = −7 °C." },
      { type: "qcm", q: "Pour tout nombre a, que vaut a − (−a) ?",
        options: ["0", "2a", "−2a", "a²"], answer: 1,
        explain: "a − (−a) = a + a = 2a (soustraire l'opposé revient à ajouter)." }
    ]},
    { title: "Problème 1 · Le plongeur et le sous-marin", statement: "Un plongeur part de la surface (altitude 0 m). Il descend de 18 m, remonte de 7 m, puis redescend de 11 m. Pendant ce temps, un petit sous-marin situé à l'altitude −40 m remonte de 15 m.", items: [
      { type: "num", label: "a)", q: "Quelle est l'altitude du plongeur après ses trois déplacements (en m) ?", answer: "-22",
        solution: "On additionne des relatifs : −18 + 7 − 11 = −22 m." },
      { type: "num", label: "b)", q: "Quelle est l'altitude du sous-marin après sa remontée (en m) ?", answer: "-25",
        solution: "−40 + 15 = −25 m." },
      { type: "num", label: "c)", q: "Quelle distance sépare alors le plongeur du sous-marin (en m) ?", answer: "3",
        hint: "Une distance est toujours positive.",
        solution: "Distance = |−22 − (−25)| = |3| = 3 m. Le plongeur est 3 m plus haut que le sous-marin." },
      { type: "num", label: "d)", q: "Le plongeur remonte vers la surface à 4 m par minute depuis son altitude actuelle. Combien de minutes lui faut-il ?", answer: "5.5",
        solution: "Il doit gagner 22 m : 22 ÷ 4 = 5,5 minutes." }
    ]},
    { title: "Problème 2 · Relevés de température", statement: "Dans une station de montagne, les températures minimales relevées sur cinq jours consécutifs sont : −4 °C ; 2 °C ; −7 °C ; 0 °C ; 3 °C.", items: [
      { type: "num", label: "a)", q: "Quelle est la température moyenne sur ces cinq jours (en °C) ?", answer: "-1.2",
        solution: "Moyenne = (−4 + 2 − 7 + 0 + 3) ÷ 5 = −6 ÷ 5 = −1,2 °C." },
      { type: "num", label: "b)", q: "Quel est l'écart entre le jour le plus chaud et le jour le plus froid (en °C) ?", answer: "10",
        solution: "Écart = 3 − (−7) = 10 °C." },
      { type: "num", label: "c)", q: "Le lendemain, il fait 2,3 °C de moins que la moyenne de ces cinq jours. Quelle température (en °C) ?", answer: "-3.5",
        hint: "Utilise la moyenne trouvée en a).",
        solution: "−1,2 − 2,3 = −3,5 °C." }
    ]}
  ]
};
</script>
