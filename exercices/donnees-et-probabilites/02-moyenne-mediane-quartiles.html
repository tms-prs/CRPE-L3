    { title: "A. Calculer une moyenne", items: [
      { type: "num", q: "Nombre de frères et sœurs dans une classe de 30 élèves : 0 (7 élèves) ; 1 (9 élèves) ; 2 (8 élèves) ; 3 (4 élèves) ; 4 (2 élèves). Quelle est la moyenne ?", answer: "1.5",
        hint: "Moyenne pondérée : additionne (valeur × effectif), puis divise par 30.",
        solution: "0×7 + 1×9 + 2×8 + 3×4 + 4×2 = 0 + 9 + 16 + 12 + 8 = 45 ; 45 ÷ 30 = 1,5." },
      { type: "num", q: "Une série prend les valeurs 2 ; 4 ; 6 ; 10 avec les fréquences 0,1 ; 0,4 ; 0,3 ; 0,2. Quelle est la moyenne ?", answer: "5.6",

        solution: "2×0,1 + 4×0,4 + 6×0,3 + 10×0,2 = 0,2 + 1,6 + 1,8 + 2 = 5,6." },
      { type: "num", q: "Durée du trajet (en minutes) de 50 personnes : [0 ; 10[ : 6 ; [10 ; 20[ : 14 ; [20 ; 30[ : 18 ; [30 ; 40[ : 12. Estimer la durée moyenne (en minutes).", answer: "22.2",
        hint: "Remplace chaque classe par son centre : 5 ; 15 ; 25 ; 35.",

        solution: "Somme nécessaire : 5 × 13 = 65. Somme actuelle : 11 + 13 + 9 + 15 = 48. Note à obtenir : 65 − 48 = 17." }

    { title: "B. Propriétés de la moyenne", items: [

        solution: "1 800 + 150 = 1 950 €." },
      { type: "num", q: "Classe A : 18 élèves, moyenne 11. Classe B : 12 élèves, moyenne 14. Quelle est la moyenne des 30 élèves ?", answer: "12.2",

        solution: "(18×11 + 12×14) ÷ 30 = (198 + 168) ÷ 30 = 366 ÷ 30 = 12,2. (Et non (11 + 14) ÷ 2 = 12,5.)" },
      { type: "num", q: "Cinq nombres ont pour moyenne 8. On ajoute le nombre 14 à la série. Quelle est la moyenne des six nombres ?", answer: "9",

        solution: "Somme : 5 × 8 = 40. Avec 14 : 54. Moyenne : 54 ÷ 6 = 9." },
      { type: "num", q: "La moyenne de 25 élèves est 12,6. Quelle est la somme de leurs notes ?", answer: "315",

        solution: "25 × 12,6 = 315." }
    ]},
    { title: "C. Médiane et étendue", items: [
      { type: "num", q: "Quelle est la médiane de 12 ; 5 ; 9 ; 15 ; 7 ; 11 ; 3 ?", answer: "9",

        solution: "Rangée : 3 ; 5 ; 7 ; 9 ; 11 ; 12 ; 15. Effectif 7 : médiane = 4e valeur = 9." },

        solution: "10 − (−3) = 13 °C." }

        solution: "15 ÷ 4 = 3,75, rang 4 : Q1 = 7. Vérification : 4 valeurs sur 15 (≈ 26,7 %) sont ≤ 7, alors que 3 valeurs (20 %) sont ≤ 5, ce qui est insuffisant." },

      { type: "num", q: "Même série de 15 valeurs. Quel est l'écart interquartile ?", answer: "10",
        hint: "Écart interquartile = Q3 − Q1.",
        solution: "17 − 7 = 10." },
      { type: "num", q: "Test noté de 1 à 4 ; effectifs de 20 élèves : note 1 → 4 ; note 2 → 6 ; note 3 → 6 ; note 4 → 4. Quelle est la valeur de Q3 ?", answer: "3",

        solution: "Le rang 15 est dans la tranche du cumul 10 à 16 : valeur 3. Q3 = 3." }

        solution: "12 ÷ 4 = 3 : Q1 est la 3e valeur, soit 6. C'est une valeur de la série, contrairement à 7,5." },

        solution: "14 − 6 = 8." },
      { type: "qcm", q: "Classe X : médiane 12, écart interquartile 2. Classe Y : médiane 12, écart interquartile 6. Que peut-on affirmer ?",

          "La classe X est plus homogène que la classe Y",
          "La classe Y est plus homogène que la classe X",

      { type: "num", label: "a)", q: "Quelle est la moyenne de la classe ?", answer: "11.3",
        solution: "6×2 + 8×3 + 10×5 + 12×4 + 14×3 + 16×2 + 18×1 = 12 + 24 + 50 + 48 + 42 + 32 + 18 = 226 ; 226 ÷ 20 = 11,3." },
      { type: "num", label: "b)", q: "Quelle est la médiane ?", answer: "11",
        hint: "Effectif 20 : rangs 10 et 11.",
        solution: "Le rang 10 correspond à la note 10 (cumul 10), le rang 11 à la note 12. Médiane : (10 + 12) ÷ 2 = 11." },
      { type: "num", label: "c)", q: "Quelle est la valeur de Q1 ?", answer: "8",

      { type: "num", label: "a)", q: "Quel est le salaire moyen (en €, arrondi au centime) ?", answer: "2214.29", tol: 0.05,

      { type: "num", label: "b)", q: "Quel est le salaire médian (en €) ?", answer: "1600",

        solution: "La série est déjà rangée ; la 4e valeur est 1 600 €. La médiane est plus représentative ici que la moyenne, tirée vers le haut par le salaire de 6 000 €." },

    ]}
  ]
};
