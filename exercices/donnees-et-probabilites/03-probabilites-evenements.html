        hint: "Compte les issues favorables, puis divise par 6.",
        solution: "Multiples de 3 : 3 et 6, soit 2 issues favorables sur 6 (équiprobables). P = 2/6 = 1/3." },
      { type: "num", q: "Une urne contient 5 boules rouges, 3 vertes et 2 jaunes. On tire une boule au hasard (boules indiscernables au toucher). Quelle est la probabilité qu'elle soit verte ? (écriture décimale)", answer: "0.3",
        hint: "Combien y a-t-il de boules en tout ?",
        solution: "5 + 3 + 2 = 10 boules, dont 3 vertes : P = 3/10 = 0,3." },
      { type: "num", q: "On tire une carte au hasard dans un jeu de 32 cartes (4 valets, 4 dames, 4 rois, etc.). Quelle est la probabilité d'obtenir une figure (valet, dame ou roi) ? (fraction irréductible)", answer: "3/8", irreducible: true,
        hint: "Combien de figures dans le jeu ?",
        solution: "3 × 4 = 12 figures sur 32 cartes : P = 12/32 = 3/8." },
      { type: "num", q: "Un sac contient 12 jetons numérotés de 1 à 12. On en tire un au hasard. Quelle est la probabilité que le numéro soit un nombre premier ? (fraction irréductible)", answer: "5/12", irreducible: true,

        solution: "Nombres premiers jusqu'à 12 : 2, 3, 5, 7, 11, soit 5 issues favorables sur 12. P = 5/12." },
      { type: "num", q: "On choisit au hasard une lettre du mot MATHEMATIQUES (chaque lettre écrite compte, soit 13 lettres). Quelle est la probabilité de choisir une voyelle (A, E, I, O, U, Y) ? (fraction irréductible)", answer: "6/13", irreducible: true,
        hint: "Compte les voyelles lettre par lettre : M-A-T-H-E-M-A-T-I-Q-U-E-S.",
        solution: "Voyelles : A, E, A, I, U, E, soit 6 lettres sur 13. P = 6/13." }

    { title: "B. Loi de probabilité", items: [
      { type: "num", q: "Une roue donne les probabilités suivantes : rouge 0,2 ; bleu 0,35 ; vert 0,25 ; jaune ? Il n'y a pas d'autre couleur. Quelle est la probabilité du jaune ? (décimal)", answer: "0.2",
        hint: "La somme des probabilités de toutes les issues vaut 1.",
        solution: "P(jaune) = 1 − (0,2 + 0,35 + 0,25) = 1 − 0,8 = 0,2." },
      { type: "num", q: "Un dé est truqué : le 6 sort avec la probabilité 0,4 et les cinq autres faces sont équiprobables. Quelle est la probabilité d'obtenir 3 ? (décimal)", answer: "0.12",

        solution: "Aucun 6 : 5 × 5 = 25 couples sur 36. P(au moins un 6) = 1 − 25/36 = 11/36." },
      { type: "num", q: "On lance deux dés équilibrés à 6 faces et on fait la somme. Quelle est la probabilité d'obtenir une somme égale à 8 ? (fraction)", answer: "5/36", irreducible: true,

        solution: "P(6) = 1/6 donc 600 × 1/6 = 100 en moyenne." },

        solution: "118 ÷ 600 ≈ 0,1967, soit 0,197 au millième." },

          "Le dé est truqué car 0,197 ≠ 1/6",
          "Elle est proche de P(6) = 1/6 ≈ 0,167 : l'écart est normal pour un échantillon fini",
          "La probabilité du 6 vaut maintenant 0,197",
          "Il aurait fallu obtenir exactement 100 fois le 6"],
        answer: 1,
        explain: "Une fréquence observée fluctue autour de la probabilité théorique. Un écart de cet ordre sur 600 lancers n'est pas une preuve de dé truqué, et la probabilité du modèle ne change pas." }
