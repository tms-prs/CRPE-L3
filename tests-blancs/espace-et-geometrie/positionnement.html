  sections: [

      { type: "num", q: "Quelle est la distance entre les points A(−3) et B(8) sur une droite graduée ?", answer: "11",

      { type: "num", q: "Deux angles sont complémentaires. L'un mesure 37°. Combien mesure l'autre (en °) ?", answer: "53",

      { type: "qcm", q: "Deux droites coupées par une sécante forment des angles correspondants égaux. On peut conclure que…",

    ]},
    { title: "Vecteurs et Chasles", part: "08", items: [
      { type: "qcm", q: "Que vaut →AB + →BC ?",

    ]},

        solution: "V = (4/3) × π × 6³ = (4/3) × 216 × π = 288π cm³." }
    ]}
  ]
