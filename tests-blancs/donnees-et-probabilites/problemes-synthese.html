<script>
window.PAGE = {
  id: "synthese-donnees-et-probabilites",
  title: "Problèmes de synthèse — Données et probabilités",
  subtitle: "4 problèmes dans l'esprit du devoir ou du concours : plusieurs notions du thème se mêlent et rien n'indique la méthode. À toi de repérer les informations utiles et la propriété à employer. Chaque question a un indice discret et une correction détaillée qui nomme la méthode. 24 questions.",
  sections: [
    { title: "Problème 1 · Les emprunts du CDI", statement: "Le CDI d'un collège a relevé le nombre de livres empruntés en un mois par 40 élèves de 3e : 0 livre pour 6 élèves ; 1 livre pour 9 élèves ; 2 livres pour 12 élèves ; 3 livres pour 8 élèves ; 4 livres pour 4 élèves ; 5 livres pour 1 élève.", items: [
      { type: "num", label: "a)", q: "Quel pourcentage des élèves a emprunté au moins 3 livres ?", answer: "32.5",
        hint: "Additionne les effectifs concernés avant de calculer la fréquence.",
        solution: "Effectif : 8 + 4 + 1 = 13 élèves. Fréquence : 13 ÷ 40 = 0,325, soit 32,5 % (effectif cumulé décroissant, puis fréquence)." },
      { type: "num", label: "b)", q: "Quel est le nombre moyen de livres empruntés par élève ? (valeur décimale)", answer: "1.95",
        hint: "Chaque valeur est à pondérer par son effectif.",
        solution: "Moyenne pondérée : (0 × 6 + 1 × 9 + 2 × 12 + 3 × 8 + 4 × 4 + 5 × 1) ÷ 40 = (0 + 9 + 24 + 24 + 16 + 5) ÷ 40 = 78 ÷ 40 = 1,95." },
      { type: "num", label: "c)", q: "Quelle est la médiane de cette série ?", answer: "2",
        hint: "40 valeurs : regarde les 20e et 21e.",
        solution: "Effectifs cumulés croissants : 6 (≤ 0), 15 (≤ 1), 27 (≤ 2). Les 20e et 21e valeurs valent toutes deux 2 : la médiane est 2." },
      { type: "num", label: "d)", q: "Quel est l'écart interquartile de cette série ?", answer: "2",
        hint: "25 % de 40 = 10 et 75 % de 40 = 30.",
        solution: "Q1 est la plus petite valeur telle qu'au moins 25 % des données lui soient inférieures ou égales : c'est la 10e valeur, soit 1 (15 valeurs ≤ 1). Q3 est la 30e valeur : 27 valeurs sont ≤ 2 et 35 sont ≤ 3, donc Q3 = 3. Écart interquartile : 3 − 1 = 2." },
      { type: "num", label: "e)", q: "On représente la série par un diagramme circulaire (un tour complet = 360°). Quel est l'angle du secteur « 2 livres », en degrés ?", answer: "108",
        solution: "Proportionnalité entre effectif et angle : 12 ÷ 40 × 360 = 108°." },
      { type: "num", label: "f)", q: "Un 41e élève est interrogé et la moyenne passe à exactement 2 livres par élève. Combien de livres a-t-il empruntés ?", answer: "4",
        hint: "Raisonne sur le total des livres.",
        solution: "Après ajout : total de livres = 41 × 2 = 82. Avant : 78 livres. Le 41e élève en a emprunté 82 − 78 = 4 (raisonnement sur les sommes)." }
    ]},
    { title: "Problème 2 · Deux classes, un même devoir", statement: "Deux classes de 12 élèves passent le même devoir noté sur 20. Notes de la classe A, rangées : 6 ; 8 ; 9 ; 10 ; 11 ; 11 ; 12 ; 12 ; 13 ; 14 ; 15 ; 17. Notes de la classe B, rangées : 2 ; 5 ; 8 ; 11 ; 12 ; 12 ; 12 ; 12 ; 14 ; 16 ; 17 ; 17. Les quartiles sont définis ainsi : Q1 (respectivement Q3) est la plus petite valeur de la série telle qu'au moins 25 % (respectivement 75 %) des données lui soient inférieures ou égales.", items: [
      { type: "num", label: "a)", q: "Quelle est la médiane de la classe A ?", answer: "11.5",
        hint: "12 valeurs : regarde les 6e et 7e.",
        solution: "Effectif pair : la médiane est la moyenne des 6e et 7e valeurs, (11 + 12) ÷ 2 = 11,5." },
      { type: "num", label: "b)", q: "Quel est l'écart interquartile de la classe A ?", answer: "4",
        hint: "25 % de 12 = 3 ; 75 % de 12 = 9.",
        solution: "Q1 est la 3e valeur : 9. Q3 est la 9e valeur : 13. Écart interquartile : 13 − 9 = 4." },
      { type: "num", label: "c)", q: "Quel est l'écart interquartile de la classe B ?", answer: "6",
        solution: "Q1 = 3e valeur = 8 ; Q3 = 9e valeur = 14. Écart interquartile : 14 − 8 = 6." },
      { type: "qcm", label: "d)", q: "Les deux classes ont la même moyenne (11,5). Laquelle des deux a les notes les plus homogènes ?",
        options: ["La classe A", "La classe B", "On ne peut pas comparer"], answer: 0,
        explain: "À moyenne égale, on compare la dispersion : écart interquartile 4 contre 6, étendue 11 (17 − 6) contre 15 (17 − 2). Les notes de la classe A sont plus resserrées." },
      { type: "num", label: "e)", q: "On réunit les deux classes en un groupe de 24 élèves. Quelle est la moyenne de ce groupe ?", answer: "11.5",
        hint: "Calcule la somme des notes de chaque classe.",
        solution: "Somme des notes de A : 138 ; somme des notes de B : 138. Moyenne des 24 élèves : 276 ÷ 24 = 11,5 (moyenne de deux groupes de même effectif, donc moyenne des moyennes)." }
    ]},
    { title: "Problème 3 · Le sac de jetons", statement: "Un sac contient 20 jetons numérotés de 1 à 20, indiscernables au toucher. On tire un jeton au hasard. On note A l'événement « le numéro est pair » et B l'événement « le numéro est un multiple de 5 ».", items: [
      { type: "num", label: "a)", q: "Quelle est la probabilité de A ? (fraction irréductible)", answer: "1/2", irreducible: true,
        solution: "Situation d'équiprobabilité : 10 numéros pairs sur 20, donc P(A) = 10/20 = 1/2." },
      { type: "num", label: "b)", q: "Quelle est la probabilité de B ? (fraction irréductible)", answer: "1/5", irreducible: true,
        solution: "Multiples de 5 : 5, 10, 15, 20, soit 4 jetons : P(B) = 4/20 = 1/5." },
      { type: "qcm", label: "c)", q: "Les événements A et B sont-ils incompatibles ?",
        options: ["Oui, ils ne peuvent pas se réaliser en même temps", "Non, un même jeton peut réaliser A et B"], answer: 1,
        explain: "Le jeton 10 est pair et multiple de 5 : A ∩ B n'est pas vide, donc A et B ne sont pas incompatibles." },
      { type: "num", label: "d)", q: "Quelle est la probabilité de A ∩ B ? (fraction irréductible)", answer: "1/10", irreducible: true,
        hint: "Quels numéros sont à la fois pairs et multiples de 5 ?",
        solution: "Numéros communs : 10 et 20, soit P(A ∩ B) = 2/20 = 1/10." },
      { type: "num", label: "e)", q: "Quelle est la probabilité de A ∪ B ? (fraction irréductible)", answer: "3/5", irreducible: true,
        hint: "Ne compte pas deux fois les numéros communs.",
        solution: "P(A ∪ B) = P(A) + P(B) − P(A ∩ B) = 1/2 + 1/5 − 1/10 = 5/10 + 2/10 − 1/10 = 6/10 = 3/5." },
      { type: "num", label: "f)", q: "Quelle est la probabilité que le numéro ne soit ni pair ni multiple de 5 ? (fraction irréductible)", answer: "2/5", irreducible: true,
        solution: "Événement contraire de A ∪ B : 1 − 3/5 = 2/5. (Vérification : 1, 3, 7, 9, 11, 13, 17, 19, soit 8 jetons sur 20.)" },
      { type: "num", label: "g)", q: "On ajoute dans le sac des jetons portant chacun un numéro impair (les jetons restent équiprobables). Combien faut-il en ajouter pour que la probabilité de A devienne 1/3 ?", answer: "10",
        hint: "Le nombre de jetons pairs ne change pas.",
        solution: "Il y a toujours 10 jetons pairs. Avec k jetons ajoutés : 10 ÷ (20 + k) = 1/3, donc 20 + k = 30 et k = 10." }
    ]},
    { title: "Problème 4 · Le jeu de la kermesse", statement: "À la kermesse, on lance un dé équilibré à 6 faces, puis on tire au hasard une boule dans un sac contenant 3 boules rouges et 1 boule verte, indiscernables au toucher. Les deux épreuves sont indépendantes. Le joueur gagne si le dé indique un nombre pair ET si la boule tirée est rouge.", items: [
      { type: "num", label: "a)", q: "Combien y a-t-il d'issues possibles pour l'ensemble des deux épreuves, en considérant les 4 boules comme distinctes ?", answer: "24",
        solution: "Tableau à double entrée (ou arbre) : 6 résultats du dé × 4 boules = 24 issues équiprobables." },
      { type: "num", label: "b)", q: "Quelle est la probabilité de gagner à une partie ? (fraction irréductible)", answer: "3/8", irreducible: true,
        hint: "Arbre pondéré : on multiplie les probabilités le long d'une branche.",
        solution: "P(pair) = 1/2 et P(rouge) = 3/4. Épreuves indépendantes : P(gagner) = 1/2 × 3/4 = 3/8 (soit 9 issues favorables sur 24)." },
      { type: "num", label: "c)", q: "Quelle est la probabilité de perdre à une partie ? (fraction irréductible)", answer: "5/8", irreducible: true,
        solution: "Événement contraire de « gagner » : 1 − 3/8 = 5/8." },
      { type: "num", label: "d)", q: "Un joueur fait 3 parties indépendantes. Quelle est la probabilité qu'il gagne au moins une fois ? (fraction irréductible)", answer: "387/512", irreducible: true,
        hint: "Passe par « ne gagner aucune fois ».",
        solution: "Contraire de « au moins une victoire » : trois défaites, de probabilité (5/8)³ = 125/512. Donc 1 − 125/512 = 387/512." },
      { type: "num", label: "e)", q: "Un tableur simule 1 000 parties et donne 362 victoires. Quel est l'écart (positif, valeur décimale) entre la fréquence observée de victoire et la probabilité théorique ?", answer: "0.013", tol: 0.0005,
        hint: "Compare des fréquences, pas des effectifs.",
        solution: "Fréquence observée : 362 ÷ 1 000 = 0,362. Probabilité théorique : 3/8 = 0,375. Écart : 0,375 − 0,362 = 0,013." },
      { type: "qcm", label: "f)", q: "On simule maintenant 10 000 parties. Que peut-on raisonnablement prévoir pour la fréquence de victoire ?",
        options: ["Elle vaudra exactement 0,375", "Elle sera proche de 0,375, avec en général un écart plus faible qu'avec 1 000 parties", "Elle sera forcément différente de 0,375 d'au moins 0,05"], answer: 1,
        explain: "Fluctuation d'échantillonnage : quand le nombre de répétitions augmente, la fréquence se stabilise autour de la probabilité théorique, sans l'atteindre exactement de façon certaine." }
    ]}
  ]
};
</script>
